<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>When Are My Taxes Due? | LT Tax Co.</title><style>:root{--b:#5A0E1E;--bd:#3f0914;--c:#2E2E2E;--s:#D9D9D9;--cr:#fbf7ef;--cr2:#f5eee3;--w:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--cr);color:var(--c);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.wrap{width:min(960px,calc(100% - 36px));margin:auto}header{border-bottom:1px solid #e8ded0}.nav{min-height:90px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand img{width:285px;max-width:42vw;display:block}nav{display:flex;gap:20px;flex-wrap:wrap;font-weight:700;font-size:.9rem}a{color:inherit}nav a,.btn{text-decoration:none}main{padding:58px 0 85px}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--bd);line-height:1.15}h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:500}.eyebrow{color:var(--b);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem}.panel{background:var(--w);padding:25px;margin:22px 0;box-shadow:0 4px 16px #0000000d;border-top:3px solid var(--b)}label{font-weight:700;display:block;margin:13px 0 5px}input,select{width:100%;max-width:480px;padding:11px;border:1px solid #bbb;border-radius:4px;font:inherit}.btn,button{display:inline-block;background:var(--b);color:#fff;border:0;padding:12px 18px;border-radius:4px;font-weight:700;cursor:pointer;margin-top:14px}.result{margin-top:20px;padding:18px;background:var(--cr2);border-left:4px solid var(--b)}.small{font-size:.9rem}footer{background:var(--c);color:#f5eee3;padding:28px 0}footer a{color:white}@media(max-width:720px){.nav{flex-direction:column;align-items:flex-start;padding:12px 0}.brand img{max-width:100%}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="logo-horizontal.png" alt="LT Tax Co."></a><nav><a href="index.html#services">Services</a><a href="resources.html">Resources</a><a href="index.html#process">How It Works</a><a href="index.html#contact">Contact</a></nav></div></header><main><div class="wrap"><div class="eyebrow">Tax Calendar</div><h1>When Are My Taxes Due?</h1><p>Choose what applies to you and get the deadlines worth putting on your calendar.</p><div class="panel"><label><input id="ind" type="checkbox" style="width:auto" checked> I file an individual federal income-tax return</label><label><input id="est" type="checkbox" style="width:auto"> I may make quarterly federal estimated-tax payments</label><label><input id="ext" type="checkbox" style="width:auto"> I may file an extension</label><button onclick="go()">Build My Calendar</button><div id="r"></div></div><script>function go(){let a=[];if(ind.checked)a.push('<li><strong>April 15:</strong> general individual filing and payment deadline (subject to weekend/holiday adjustments).</li>');if(est.checked)a.push('<li><strong>Estimated payments:</strong> April 15, June 15, September 15, and January 15 of the following year.</li>');if(ext.checked)a.push('<li><strong>Extension:</strong> generally extends time to file—not time to pay. Any expected balance is generally still due by the original deadline.</li>');r.innerHTML='<div class="result"><ul>'+a.join('')+'</ul><span class="small">Specific calendar-year dates can shift for weekends, holidays, disaster relief, or special taxpayer rules.</span></div>'}</script></div></main><footer><div class="wrap"><strong>LT Tax Co.</strong> &nbsp; | &nbsp; <a href="mailto:lily.townsend@lttaxco.com">lily.townsend@lttaxco.com</a></div></footer></body></html>
