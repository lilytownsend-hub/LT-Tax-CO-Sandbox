<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Life Changed. What Does That Mean for My Taxes? | LT Tax Co.</title><style>:root{--b:#5A0E1E;--bd:#3f0914;--c:#2E2E2E;--s:#D9D9D9;--cr:#fbf7ef;--cr2:#f5eee3;--w:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--cr);color:var(--c);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.wrap{width:min(960px,calc(100% - 36px));margin:auto}header{border-bottom:1px solid #e8ded0}.nav{min-height:90px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand img{width:285px;max-width:42vw;display:block}nav{display:flex;gap:20px;flex-wrap:wrap;font-weight:700;font-size:.9rem}a{color:inherit}nav a,.btn{text-decoration:none}main{padding:58px 0 85px}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--bd);line-height:1.15}h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:500}.eyebrow{color:var(--b);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem}.panel{background:var(--w);padding:25px;margin:22px 0;box-shadow:0 4px 16px #0000000d;border-top:3px solid var(--b)}label{font-weight:700;display:block;margin:13px 0 5px}input,select{width:100%;max-width:480px;padding:11px;border:1px solid #bbb;border-radius:4px;font:inherit}.btn,button{display:inline-block;background:var(--b);color:#fff;border:0;padding:12px 18px;border-radius:4px;font-weight:700;cursor:pointer;margin-top:14px}.result{margin-top:20px;padding:18px;background:var(--cr2);border-left:4px solid var(--b)}.small{font-size:.9rem}footer{background:var(--c);color:#f5eee3;padding:28px 0}footer a{color:white}@media(max-width:720px){.nav{flex-direction:column;align-items:flex-start;padding:12px 0}.brand img{max-width:100%}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="logo-horizontal.png" alt="LT Tax Co."></a><nav><a href="index.html#services">Services</a><a href="resources.html">Resources</a><a href="index.html#process">How It Works</a><a href="index.html#contact">Contact</a></nav></div></header><main><div class="wrap"><div class="eyebrow">Life & Taxes</div><h1>My Life Changed. What Does That Mean for My Taxes?</h1><p>Select what changed. We'll point you toward the tax questions and LT resources worth looking at next.</p><div class="panel" id="choices"><label><input type="checkbox" style="width:auto" value="marriage"> Got married</label><label><input type="checkbox" style="width:auto" value="divorce"> Got divorced or separated</label><label><input type="checkbox" style="width:auto" value="baby"> Had or adopted a baby</label><label><input type="checkbox" style="width:auto" value="kid"> My child got older</label><label><input type="checkbox" style="width:auto" value="house"> Bought a house</label><label><input type="checkbox" style="width:auto" value="sale"> Sold a house</label><label><input type="checkbox" style="width:auto" value="job"> Started or changed jobs</label><label><input type="checkbox" style="width:auto" value="second"> Added a second job</label><label><input type="checkbox" style="width:auto" value="lost"> Lost a job / received unemployment</label><label><input type="checkbox" style="width:auto" value="gig"> Started a side gig</label><label><input type="checkbox" style="width:auto" value="college"> Started college or paid student loans</label><label><input type="checkbox" style="width:auto" value="retire"> Retired / started Social Security / took retirement money</label><label><input type="checkbox" style="width:auto" value="market"> Used Marketplace health insurance</label><label><input type="checkbox" style="width:auto" value="move"> Moved to another state</label><button onclick="go()">Show Me What Matters</button><div id="r"></div></div><script>const tips={marriage:'Your year-end marital status can change filing options. Recheck household withholding.',divorce:'Filing status, dependents, and agreements can matter. This is a good professional-review item.',baby:'A new qualifying child can affect credits and filing information. Make sure the child has an SSN before claiming SSN-dependent benefits.',kid:'Some child-related tax benefits change as children age.',house:'Keep your closing records, mortgage-interest information, and property-tax records. Buying a home does not automatically create a large refund.',sale:'Keep purchase, improvement, and sale records. Home-sale gain rules depend on the facts.',job:'A pay change is a good time to revisit withholding → use the W-4 Checker.',second:'Each employer sees its own payroll; your tax return sees the whole year → use the W-4 Checker.',lost:'Unemployment compensation is generally federally taxable. Watch for Form 1099-G.',gig:'Self-employment can create income tax and self-employment tax → use the side-gig tool and deduction guide.',college:'Watch for education and student-loan forms such as 1098-T or 1098-E when applicable.',retire:'Retirement distributions and Social Security can affect taxable income and withholding.',market:'Marketplace coverage can create Form 1095-A and premium-tax-credit reconciliation.',move:'Moving between states can create part-year or multi-state filing questions.'};function go(){let a=[...document.querySelectorAll('#choices input:checked')].map(x=>'<li>'+tips[x.value]+'</li>').join('');r.innerHTML='<div class="result"><strong>Your tax-time watch list:</strong><ul>'+(a||'<li>Select at least one change.</li>')+'</ul></div>'}</script></div></main><footer><div class="wrap"><strong>LT Tax Co.</strong> &nbsp; | &nbsp; <a href="mailto:lily.townsend@lttaxco.com">lily.townsend@lttaxco.com</a></div></footer></body></html>
