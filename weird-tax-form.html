<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Received a Weird Tax Form. Now What? | LT Tax Co.</title><style>:root{--b:#5A0E1E;--bd:#3f0914;--c:#2E2E2E;--s:#D9D9D9;--cr:#fbf7ef;--cr2:#f5eee3;--w:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--cr);color:var(--c);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.wrap{width:min(960px,calc(100% - 36px));margin:auto}header{border-bottom:1px solid #e8ded0}.nav{min-height:90px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand img{width:285px;max-width:42vw;display:block}nav{display:flex;gap:20px;flex-wrap:wrap;font-weight:700;font-size:.9rem}a{color:inherit}nav a,.btn{text-decoration:none}main{padding:58px 0 85px}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--bd);line-height:1.15}h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:500}.eyebrow{color:var(--b);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem}.panel{background:var(--w);padding:25px;margin:22px 0;box-shadow:0 4px 16px #0000000d;border-top:3px solid var(--b)}label{font-weight:700;display:block;margin:13px 0 5px}input,select{width:100%;max-width:480px;padding:11px;border:1px solid #bbb;border-radius:4px;font:inherit}.btn,button{display:inline-block;background:var(--b);color:#fff;border:0;padding:12px 18px;border-radius:4px;font-weight:700;cursor:pointer;margin-top:14px}.result{margin-top:20px;padding:18px;background:var(--cr2);border-left:4px solid var(--b)}.small{font-size:.9rem}footer{background:var(--c);color:#f5eee3;padding:28px 0}footer a{color:white}@media(max-width:720px){.nav{flex-direction:column;align-items:flex-start;padding:12px 0}.brand img{max-width:100%}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="logo-horizontal.png" alt="LT Tax Co."></a><nav><a href="index.html#services">Services</a><a href="resources.html">Resources</a><a href="index.html#process">How It Works</a><a href="index.html#contact">Contact</a></nav></div></header><main><div class="wrap"><div class="eyebrow">Tax Form Decoder</div><h1>I Received a Weird Tax Form. Now What?</h1><p>Pick the form and we'll tell you—in normal-person language—why it probably showed up and what to do with it.</p><div class="panel"><label>What form did you receive?</label><select id="f"><option>W-2</option><option>1099-NEC</option><option>1099-K</option><option>1099-INT</option><option>1099-DIV</option><option>1099-R</option><option>1099-G</option><option>SSA-1099</option><option>1098</option><option>1098-E</option><option>1098-T</option><option>1095-A</option><option>Schedule K-1</option></select><button onclick="go()">What Is This Thing?</button><div id="r"></div></div><script>const d={'W-2':'Wages from an employer. Keep it for your return and make sure you have one from each employer.','1099-NEC':'Usually nonemployee/contractor compensation. It may belong with self-employment income and related business expenses.','1099-K':'Reports certain payment-card or third-party-network payments. It does not by itself tell you what portion is taxable profit.','1099-INT':'Interest income, commonly from a bank or financial account.','1099-DIV':'Dividend and certain investment distributions.','1099-R':'Retirement-plan, pension, IRA, or similar distributions. Taxability depends on the distribution.','1099-G':'Often unemployment compensation or a state/local government payment.','SSA-1099':'Reports Social Security benefits. Depending on overall income, some benefits may be taxable.','1098':'Commonly reports mortgage interest received by a lender. Keep it with your home-related tax records.','1098-E':'Reports qualifying student-loan interest received by a lender.','1098-T':'Education statement from an eligible educational institution. It can be relevant to education tax benefits.','1095-A':'Marketplace health-insurance statement. Do not file a return that requires Marketplace reconciliation without it.','Schedule K-1':'Reports your share of items from a partnership, S corporation, estate, trust, or other pass-through arrangement. K-1s can require additional review.'};function go(){r.innerHTML='<div class="result"><strong>'+f.value+':</strong> '+d[f.value]+'<br><br>Keep the form with your tax records. If something looks wrong, do not alter the form yourself—contact the issuer or your tax professional.</div>'}</script></div></main><footer><div class="wrap"><strong>LT Tax Co.</strong> &nbsp; | &nbsp; <a href="mailto:lily.townsend@lttaxco.com">lily.townsend@lttaxco.com</a></div></footer></body></html>
