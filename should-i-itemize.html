<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Should I Itemize? | LT Tax Co.</title><style>:root{--b:#5A0E1E;--bd:#3f0914;--c:#2E2E2E;--s:#D9D9D9;--cr:#fbf7ef;--cr2:#f5eee3;--w:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--cr);color:var(--c);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.wrap{width:min(960px,calc(100% - 36px));margin:auto}header{border-bottom:1px solid #e8ded0}.nav{min-height:90px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand img{width:285px;max-width:42vw;display:block}nav{display:flex;gap:20px;flex-wrap:wrap;font-weight:700;font-size:.9rem}a{color:inherit}nav a,.btn{text-decoration:none}main{padding:58px 0 85px}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--bd);line-height:1.15}h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:500}.eyebrow{color:var(--b);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem}.panel{background:var(--w);padding:25px;margin:22px 0;box-shadow:0 4px 16px #0000000d;border-top:3px solid var(--b)}label{font-weight:700;display:block;margin:13px 0 5px}input,select{width:100%;max-width:480px;padding:11px;border:1px solid #bbb;border-radius:4px;font:inherit}.btn,button{display:inline-block;background:var(--b);color:#fff;border:0;padding:12px 18px;border-radius:4px;font-weight:700;cursor:pointer;margin-top:14px}.result{margin-top:20px;padding:18px;background:var(--cr2);border-left:4px solid var(--b)}.small{font-size:.9rem}footer{background:var(--c);color:#f5eee3;padding:28px 0}footer a{color:white}@media(max-width:720px){.nav{flex-direction:column;align-items:flex-start;padding:12px 0}.brand img{max-width:100%}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="logo-horizontal.png" alt="LT Tax Co."></a><nav><a href="index.html#services">Services</a><a href="resources.html">Resources</a><a href="index.html#process">How It Works</a><a href="index.html#contact">Contact</a></nav></div></header><main><div class="wrap"><div class="eyebrow">Deduction Check</div><h1>Should I Itemize?</h1><p>See whether the itemized deductions you already know about are in the neighborhood of your standard deduction.</p><div class="panel"><label>Filing status</label><select id="s"><option value="single">Single</option><option value="mfj">Married filing jointly</option><option value="mfs">Married filing separately</option><option value="hoh">Head of household</option></select><label>Mortgage interest</label><input id="mi" type="number" min="0"><label>State/local taxes potentially deductible (before applicable limits)</label><input id="salt" type="number" min="0"><label>Charitable contributions potentially deductible</label><input id="char" type="number" min="0"><label>Medical expenses potentially deductible after applicable AGI threshold</label><input id="med" type="number" min="0"><label>Other potential itemized deductions</label><input id="oth" type="number" min="0"><button onclick="go()">Compare</button><div id="r"></div></div><script>function go(){let t={single:16100,mfj:32200,mfs:16100,hoh:24150}[s.value],sum=+mi.value + +salt.value + +char.value + +med.value + +oth.value;r.innerHTML='<div class="result"><strong>Entered potential itemized deductions:</strong> $'+sum.toLocaleString()+'<br><strong>2026 basic standard deduction:</strong> $'+t.toLocaleString()+'<br><br>'+(sum>t?'Your entered amount is above the basic standard deduction. Itemizing is worth a closer look.':'Based on these entries, the basic standard deduction is currently higher. There may still be special circumstances to review.')+'</div>'}</script></div></main><footer><div class="wrap"><strong>LT Tax Co.</strong> &nbsp; | &nbsp; <a href="mailto:lily.townsend@lttaxco.com">lily.townsend@lttaxco.com</a></div></footer></body></html>
